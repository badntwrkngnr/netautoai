apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: infrahub
  namespace: automation
spec:
  entryPoints: [infrahub]
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: infrahub-server   # verify after install: kubectl -n automation get svc | grep infrahub
          port: 8000