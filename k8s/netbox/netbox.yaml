apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: netbox-media, namespace: automation }
spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: netbox-reports, namespace: automation }
spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 256Mi } } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: netbox-scripts, namespace: automation }
spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 256Mi } } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: netbox-postgres-data, namespace: automation }
spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: netbox-redis-data, namespace: automation }
spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 512Mi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: netbox-postgres, namespace: automation }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: netbox-postgres } }
  template:
    metadata: { labels: { app: netbox-postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: netbox }
            - { name: POSTGRES_DB, value: netbox }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: netbox-secrets, key: db-password } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: netbox-postgres-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: netbox-postgres, namespace: automation }
spec: { selector: { app: netbox-postgres }, ports: [{ port: 5432, targetPort: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: netbox-redis, namespace: automation }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: netbox-redis } }
  template:
    metadata: { labels: { app: netbox-redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c", "redis-server --appendonly yes --requirepass $REDIS_PASSWORD"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: netbox-secrets, key: redis-password } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: netbox-redis-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: netbox-redis, namespace: automation }
spec: { selector: { app: netbox-redis }, ports: [{ port: 6379, targetPort: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: netbox-redis-cache, namespace: automation }
spec:
  replicas: 1
  selector: { matchLabels: { app: netbox-redis-cache } }
  template:
    metadata: { labels: { app: netbox-redis-cache } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c", "redis-server --requirepass $REDIS_PASSWORD"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: netbox-secrets, key: redis-password } }
---
apiVersion: v1
kind: Service
metadata: { name: netbox-redis-cache, namespace: automation }
spec: { selector: { app: netbox-redis-cache }, ports: [{ port: 6379, targetPort: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: netbox, namespace: automation }
spec:
  replicas: 1
  selector: { matchLabels: { app: netbox } }
  template:
    metadata: { labels: { app: netbox } }
    spec:
      containers:
        - name: netbox
          image: docker.io/netboxcommunity/netbox:v4.6-5.0.1
          ports: [{ containerPort: 8080 }]
          env:
            - { name: DB_HOST, value: netbox-postgres }
            - { name: DB_NAME, value: netbox }
            - { name: DB_USER, value: netbox }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: netbox-secrets, key: db-password } }
            - { name: REDIS_HOST, value: netbox-redis }
            - { name: REDIS_CACHE_HOST, value: netbox-redis-cache }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: netbox-secrets, key: redis-password } }
            - name: REDIS_CACHE_PASSWORD
              valueFrom: { secretKeyRef: { name: netbox-secrets, key: redis-password } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: netbox-secrets, key: secret-key } }
          volumeMounts:
            - { name: media, mountPath: /opt/netbox/netbox/media }
            - { name: reports, mountPath: /opt/netbox/netbox/reports }
            - { name: scripts, mountPath: /opt/netbox/netbox/scripts }
          readinessProbe:
            httpGet: { path: /login/, port: 8080 }
            initialDelaySeconds: 90
            periodSeconds: 15
      volumes:
        - { name: media, persistentVolumeClaim: { claimName: netbox-media } }
        - { name: reports, persistentVolumeClaim: { claimName: netbox-reports } }
        - { name: scripts, persistentVolumeClaim: { claimName: netbox-scripts } }
---
apiVersion: v1
kind: Service
metadata: { name: netbox, namespace: automation }
spec: { selector: { app: netbox }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: netbox, namespace: automation }
spec:
  entryPoints: [netbox]
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services: [{ name: netbox, port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: netbox-worker, namespace: automation }
spec:
  replicas: 1
  selector: { matchLabels: { app: netbox-worker } }
  template:
    metadata: { labels: { app: netbox-worker } }
    spec:
      containers:
        - name: netbox-worker
          image: docker.io/netboxcommunity/netbox:v4.6-5.0.1
          command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
          env:
            - { name: DB_HOST, value: netbox-postgres }
            - { name: DB_NAME, value: netbox }
            - { name: DB_USER, value: netbox }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: netbox-secrets, key: db-password } }
            - { name: REDIS_HOST, value: netbox-redis }
            - { name: REDIS_CACHE_HOST, value: netbox-redis-cache }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: netbox-secrets, key: redis-password } }
            - name: REDIS_CACHE_PASSWORD
              valueFrom: { secretKeyRef: { name: netbox-secrets, key: redis-password } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: netbox-secrets, key: secret-key } }
          volumeMounts:
            - { name: media, mountPath: /opt/netbox/netbox/media }
            - { name: reports, mountPath: /opt/netbox/netbox/reports }
            - { name: scripts, mountPath: /opt/netbox/netbox/scripts }
      volumes:
        - { name: media, persistentVolumeClaim: { claimName: netbox-media } }
        - { name: reports, persistentVolumeClaim: { claimName: netbox-reports } }
        - { name: scripts, persistentVolumeClaim: { claimName: netbox-scripts } }