apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      grafana:
        port: 8080
        expose: { default: true }
        exposedPort: 8080
        protocol: TCP
      netbox:
        port: 8081
        expose: { default: true }
        exposedPort: 8081
        protocol: TCP
      zabbix:
        port: 8082
        expose: { default: true }
        exposedPort: 8082
        protocol: TCP
      infrahub:
        port: 8083
        expose: { default: true }
        exposedPort: 8083
        protocol: TCP
      hermes:
        port: 8084
        expose: { default: true }
        exposedPort: 8084
        protocol: TCP
      traefik:
        port: 8090
        expose: { default: true }
        exposedPort: 8090
        protocol: TCP
    api:
      dashboard: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: kube-system
spec:
  entryPoints:
    - traefik
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService