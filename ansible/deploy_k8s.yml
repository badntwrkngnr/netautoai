---
- name: Deploy Kubernetes manifests
  hosts: localhost
  connection: local
  become: false
  vars:
    kubeconfig_path: "{{ playbook_dir }}/.kube/manager-node-k3s.yaml"
  tasks:
    - name: Apply namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: "{{ playbook_dir }}/../k8s/namespaces.yml"

    - name: Customize bundled Traefik
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: "{{ playbook_dir }}/../k8s/traefik/helmchartconfig.yaml"

    - name: Render and apply application secrets
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', item) }}"
      loop:
        - templates/grafana-secret.yaml.j2
        - templates/zabbix-secret.yaml.j2
        - templates/netbox-secret.yaml.j2
      no_log: true

    - name: Apply Grafana manifests
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: "{{ playbook_dir }}/../k8s/grafana/grafana.yaml"

    - name: Apply Zabbix manifests
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: "{{ playbook_dir }}/../k8s/zabbix/zabbix.yaml"

    - name: Apply Netbox manifests
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: "{{ playbook_dir }}/../k8s/netbox/netbox.yaml"

- name: Ensure empty Docker config for anonymous OCI Helm pulls
      ansible.builtin.file:
        path: "{{ playbook_dir }}/.docker-empty"
        state: directory
        mode: "0700"

    - name: Write empty Docker config
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/.docker-empty/config.json"
        content: "{}"
        mode: "0600"

- name: Render Infrahub Helm values
      ansible.builtin.template:
        src: templates/infrahub-values.yaml.j2
        dest: "{{ playbook_dir }}/.infrahub-values.yaml"
        mode: "0600"
      no_log: true

    - name: Install/upgrade Infrahub via Helm
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: infrahub
        chart_ref: oci://registry.opsmill.io/opsmill/chart/infrahub
        release_namespace: automation
        values_files:
          - "{{ playbook_dir }}/.infrahub-values.yaml"
      environment:
        DOCKER_CONFIG: "{{ playbook_dir }}/.docker-empty"