---

- name: Generate containerlab topology from NetBox
  hosts: localhost
  connection: local
  become: false
  vars_files:
    - group_vars/all/vault.yml
  vars:
    clab_topology_path: "{{ playbook_dir }}/../containerlab/netautoai-lab.clab.yml"
  pre_tasks:
    - name: Ensure pynetbox/pyyaml are installed
      block:
        - name: Install pynetbox and pyyaml
          ansible.builtin.pip:
            name: [pynetbox, pyyaml]
            state: present
      rescue:
        - name: Retry with --break-system-packages
          ansible.builtin.pip:
            name: [pynetbox, pyyaml]
            state: present
            extra_args: --break-system-packages

    - name: Ensure generated-inventory directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../containerlab/generated-inventory"
        state: directory
        mode: "0755"

  tasks:
    - name: Regenerate topology from NetBox
      ansible.builtin.command:
        cmd: >
          python3 {{ playbook_dir }}/../scripts/netbox_to_containerlab.py
          --tag containerlab
          --output {{ clab_topology_path }}
      environment:
        NETBOX_URL: "http://netautoai:8081"
        NETBOX_TOKEN: "{{ netbox_superuser_api_token }}"
      changed_when: true

- name: Deploy topology on the lab VM
  hosts: lab
  become: true
  vars:
    clab_topology_local: "{{ playbook_dir }}/../containerlab/netautoai-lab.clab.yml"
    clab_topology_remote: "{{ clab_workdir }}/netautoai-lab.clab.yml"
  tasks:
    - name: Check that the locally built IOL images exist
      ansible.builtin.command: docker image inspect {{ item }}
      loop: "{{ clab_required_images }}"
      register: clab_image_check
      changed_when: false
      failed_when: false

    - name: Fail early if IOL images are missing
      ansible.builtin.assert:
        that: clab_image_check.results | selectattr('rc', 'ne', 0) | list | length == 0
        fail_msg: >-
          Missing images on the lab VM:
          {{ clab_image_check.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}.
          Build them with hellt/vrnetlab (see containerlab/README.md).

    - name: Copy topology to the lab VM
      ansible.builtin.copy:
        src: "{{ clab_topology_local }}"
        dest: "{{ clab_topology_remote }}"
        mode: "0644"

    # --reconfigure tears the lab down and rebuilds it: config pushed with
    # Ansible/Nornir must be re-applied afterwards.
    - name: Deploy containerlab topology
      ansible.builtin.command:
        cmd: containerlab deploy -t {{ clab_topology_remote }} --reconfigure
        chdir: "{{ clab_workdir }}"
      async: 1800
      poll: 15
      changed_when: true

    - name: Inspect deployed lab
      ansible.builtin.command: containerlab inspect --name {{ clab_lab_name }}
      register: clab_inspect
      changed_when: false

    - name: Show lab nodes
      ansible.builtin.debug:
        var: clab_inspect.stdout_lines

    - name: Fetch containerlab-generated Ansible inventory
      ansible.builtin.fetch:
        src: "{{ clab_workdir }}/clab-{{ clab_lab_name }}/ansible-inventory.yml"
        dest: "{{ playbook_dir }}/../containerlab/generated-inventory/{{ inventory_hostname }}-inventory.yml"
        flat: true
