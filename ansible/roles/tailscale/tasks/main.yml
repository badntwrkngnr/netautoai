---
- name: Add Tailscale apt repository key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check current tailscale connection state
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false

- name: Bring up tailscale and accept subnet routes
  ansible.builtin.command: >
    tailscale up
    --authkey={{ tailscale_authkey }}
    --accept-routes
    --accept-dns=true
    --hostname=netautoai
  when: >
    ts_status.rc != 0 or
    (ts_status.stdout | from_json).BackendState != "Running"
  # NOTE: pnetlab's advertised routes still need manual approval
  # in the Tailscale admin console the first time.

- name: Allow all traffic on the tailscale interface
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
  # tailscale0 only exists once 'tailscale up' has run, so this must
  # come after it. Scope is the tailnet only -- this is what lets
  # NGINX (8080-8083) and the SNMP traps listener (162/udp) be reached
  # from other tailnet nodes without opening those ports globally.