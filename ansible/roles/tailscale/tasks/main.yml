---
- name: Add Tailscale apt repository key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  notify: Restart tailscaled

- name: Enable tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check current tailscale connection state
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false

- name: Check Tailscale authentication status
  ansible.builtin.command: tailscale status --peers=false
  register: ts_auth_status
  changed_when: false
  failed_when: false

- name: Bring up tailscale and accept subnet routes
  ansible.builtin.command:
    cmd: >
      tailscale up
      --authkey={{ tailscale_authkey }}
      --accept-routes
      --accept-dns=true
      --hostname=netautoai
  register: tailscale_up_result
  failed_when: tailscale_up_result.rc != 0
  when: >
    ts_auth_status.rc != 0 or
    'logged out' in ts_auth_status.stdout | lower or
    ts_status.rc != 0 or
    (ts_status.stdout | from_json).BackendState | default('') != "Running"

- name: Allow all traffic on the tailscale interface
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in