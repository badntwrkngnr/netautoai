---
- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write k3s config file
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  notify: restart k3s

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_binary.stat.exists

- name: Run k3s install script
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version | default('') }}"
    INSTALL_K3S_CHANNEL: "{{ k3s_channel | default('stable') }}"
  when: not k3s_binary.stat.exists

- name: Ensure k3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for node to report Ready
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_node_status
  until: "' Ready ' in k3s_node_status.stdout"
  retries: 12
  delay: 10
  changed_when: false

- name: Fetch kubeconfig to control node
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../.kube/{{ inventory_hostname }}-k3s.yaml"
    flat: true

- name: Point fetched kubeconfig at the manager node's address
  delegate_to: localhost
  become: false
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../.kube/{{ inventory_hostname }}-k3s.yaml"
    regexp: 'server: https://127\.0\.0\.1:6443'
    replace: "server: https://{{ ansible_host }}:6443"